name: Release Multiplataforma (EloTempo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do Release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'Windows (NSIS .exe e .msi)'
            os: windows-latest
            args: '--bundles nsis,msi'
          - platform: 'Linux (Debian .deb e .AppImage)'
            os: ubuntu-22.04
            args: '--bundles deb,appimage'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Compilação do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Validação e Testes Automatizados (CI)
        run: npm run verificar

      - name: Compilar e Publicar com Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'EloTempo ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## EloTempo — Árvore Genealógica Offline & Histórica
            
            Software desktop gratuito, local-first e compatível com GEDCOM 7.0.
            
            ### Arquivos Disponíveis para Download:
            - **Windows:**
              - `EloTempo_*_x64-setup.exe` (Instalador assistido padrão)
              - `EloTempo_*_x64_pt-BR.msi` (Pacote de instalação corporativa Windows Installer)
            - **Linux:**
              - `elotempo_*_amd64.deb` (Instalador para Ubuntu, Debian, Linux Mint, Pop!_OS)
              - `elotempo_*_amd64.AppImage` (Executável universal portátil - basta dar permissão de execução e rodar)
            
            ### Novidades desta Versão:
            - Catálogo completo de 37 Linhas de Contexto Histórico e 431 eventos cronológicos.
            - 40+ Árvores Genealógicas Públicas de referência pré-carregadas.
            - Estúdio de Linhas do Tempo com comparação simultânea de vidas e zoom milenar a.C./d.C.
            - Cofre Pessoal Criptografado com padrão militar (Argon2id + ChaCha20-Poly1305).
            - Central de Impressão de alta definição e relatórios genealógicos.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
