name: Release Multiplataforma (EloTempo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do Release (ex: v1.0.0)'
        required: false
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'Windows (NSIS .exe e .msi)'
            os: windows-latest
            args: '--bundles nsis,msi'
          - platform: 'Linux (Debian .deb e .AppImage)'
            os: ubuntu-22.04
            args: '--bundles deb,appimage'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Compilação do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Validação e Testes Automatizados (CI)
        run: npm run verificar

      # As notas do release vem de RELEASE_NOTES_v<versao>.md, versionado no
      # repositorio, e nao de um texto fixo aqui. O texto fixo que existia
      # descrevia uma versao antiga e afirmava uma cifra (ChaCha20-Poly1305)
      # que o programa nunca usou -- e saiu igual em todos os releases.
      #
      # Sem o arquivo, o release FALHA de proposito: publicar sem notas
      # escritas foi o que deixou o texto errado se repetir.
      - name: Ler notas de lancamento
        id: notas
        shell: bash
        env:
          # No disparo manual, github.ref_name e o nome do branch ("main"),
          # nao a versao -- por isso a escolha depende do evento.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag invalida: '$TAG'. Esperado algo como v1.4.0."; exit 1 ;;
          esac
          ARQUIVO="RELEASE_NOTES_${TAG}.md"
          if [ ! -f "$ARQUIVO" ]; then
            echo "::error::Faltam as notas: $ARQUIVO nao existe. Escreva-as antes de publicar."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DELIM="FIM_DAS_NOTAS_$(date +%s%N)"
          {
            echo "corpo<<$DELIM"
            cat "$ARQUIVO"
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Compilar e Publicar com Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.notas.outputs.tag }}
          releaseName: 'EloTempo ${{ steps.notas.outputs.tag }}'
          releaseBody: ${{ steps.notas.outputs.corpo }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
