<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">EloTempo — logo</title>
  <desc id="desc">Símbolo E/T formado por linhas de uma linha do tempo, pontos e ramificações, acompanhado do nome EloTempo.</desc>

  <defs>
    <linearGradient id="timelineGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1D3A"/>
    </linearGradient>
  </defs>

  <!-- E/T timeline symbol -->
  <g transform="translate(90 55)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical time axis -->
    <path d="M95 40 V270" stroke="url(#timelineGradient)" stroke-width="14"/>

    <!-- past -->
    <path d="M95 40 H300" stroke="#00A896" stroke-width="14"/>
    <!-- present -->
    <path d="M95 155 H205" stroke="#2563EB" stroke-width="14"/>
    <!-- present branching / relationships -->
    <path d="M205 155 L300 120 M205 155 L300 190" stroke="#2563EB" stroke-width="14"/>
    <!-- future -->
    <path d="M95 270 H300" stroke="#0B1D3A" stroke-width="14"/>

    <!-- nodes -->
    <g stroke="none">
      <circle cx="95" cy="40" r="17" fill="#00A896"/>
      <circle cx="300" cy="40" r="17" fill="#00A896"/>

      <circle cx="95" cy="155" r="17" fill="#2563EB"/>
      <circle cx="205" cy="155" r="17" fill="#2563EB"/>
      <circle cx="300" cy="120" r="17" fill="#2563EB"/>
      <circle cx="300" cy="190" r="17" fill="#2563EB"/>

      <circle cx="95" cy="270" r="17" fill="#0B1D3A"/>
      <circle cx="300" cy="270" r="17" fill="#0B1D3A"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="455" y="235"
        font-family="Sora, Inter, Arial, sans-serif"
        font-size="112"
        font-weight="500"
        letter-spacing="-5"
        fill="#0B1D3A">EloTempo</text>

  <!-- Optional tagline from the presented concept -->
  <text x="462" y="285"
        font-family="Sora, Inter, Arial, sans-serif"
        font-size="22"
        font-weight="500"
        letter-spacing="8"
        fill="#00A896">HISTÓRIAS QUE CONECTAM GERAÇÕES.</text>
</svg>
