[package]
name = "elotempo"
version = "1.0.3"
description = "Elotempo — Software desktop offline para árvores genealógicas e contexto de vidas, compatível com GEDCOM 7.0"
authors = ["Gabriel Nascimento"]
license = "GPL-3.0-or-later"
# `repository` fica de fora até o projeto ser publicado — um endereço que não
# existe é pior do que campo ausente.
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serve as imagens da pasta de dados do app para o webview.
# Sem ela, exibir uma foto exigiria trafegar os bytes pela IPC a cada render.
tauri = { version = "2", features = ["protocol-asset"] }
# Só para o seletor de arquivo. O frontend nunca toca o sistema de arquivos:
# ele recebe um caminho e o entrega ao Rust, que faz a cópia.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
uuid = { version = "1", features = ["v4"] }
# GEDZip: o zip com o .ged e a pasta de mídia, exigido pela seção 4.
# Sem `default-features`, para não arrastar codecs que não usamos — o formato
# pede deflate, e só.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Criptografia e segurança offline (Modo Híbrido Flexível / Cofre AES-256-GCM / Argon2id)
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

[features]
default = []

# Embute o frontend no binário em vez de buscá-lo no servidor de
# desenvolvimento.
#
# O Tauri decide dev vs. produção por ESTA feature, não pelo perfil de
# compilação: em `tauri-2.x/build.rs`, `dev = !custom_protocol`. Sem ela, o
# binário aponta para `devUrl` (localhost:1420) e abre em branco com
# ERR_CONNECTION_REFUSED quando o Vite não está no ar.
#
# O `tauri build` passa `--features custom-protocol` por conta própria — sem
# esta linha, o comando do instalador falha. E é o que permite compilar um
# binário autônomo no perfil debug, rápido, para testar sem servidor.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Binário público: menor e sem símbolos de debug.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
